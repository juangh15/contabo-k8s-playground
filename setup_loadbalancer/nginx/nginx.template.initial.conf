events {}

http {
    server {
        listen 80;
        listen [::]:80;

        server_name $DOMAIN;
        server_tokens off;

        # Block direct IP access
        if ($host ~* ^\d+\.\d+\.\d+\.\d+$) {
            return 444;
        }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$DOMAIN$request_uri;
        }
    }
}
